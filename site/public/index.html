<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ceraunic</title>
<meta name="description" content="Ceraunic is building parametric weather cover for small businesses, hedged with exchange-traded weather contracts. Research preview.">
<meta property="og:title" content="Ceraunic">
<meta property="og:description" content="Parametric weather cover for small businesses, hedged with exchange-traded weather contracts.">
<meta property="og:image" content="https://ceraunic.com/og.jpg">
<meta name="theme-color" content="#023c96">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23023c96'/%3E%3Cpath d='M18 4 8 18h7l-2 10 11-15h-7z' fill='%23ffb547'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#ffffff; --muted:rgba(255,255,255,.78); --accent:#ffb547; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    font-family:"Cormorant Garamond", Garamond, Georgia, serif;
    color:var(--ink); background:#023c96;
    -webkit-font-smoothing:antialiased;
  }
  .hero {
    position:relative; min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column;
    background:#023c96 url("hero.webp") center bottom / cover no-repeat;
  }
  .hero::before {
    content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg, rgba(2,40,110,.55) 0%, rgba(2,40,110,.25) 38%, rgba(0,0,0,0) 60%);
  }
  main, footer { position:relative; z-index:1; width:100%; max-width:1180px; margin:0 auto; padding:0 28px; }
  main { padding-top:clamp(72px, 16vh, 170px); }
  h1 { font-size:clamp(56px, 9vw, 112px); line-height:1; font-weight:500; letter-spacing:-.01em; max-width:15ch; }
  p.lede { margin-top:10px; font-size:clamp(24px, 2.6vw, 32px); line-height:1.3; font-weight:500; color:rgba(255,255,255,.9); max-width:52ch; }
  p.status { margin-top:8px; font-size:19px; font-weight:600; color:var(--muted); }
  .actions { margin-top:30px; display:flex; flex-wrap:wrap; gap:12px; }
  .btn {
    display:inline-flex; align-items:center; gap:8px; text-decoration:none;
    font-size:18px; font-weight:700; padding:10px 22px; border-radius:10px;
    transition:transform .15s ease, background .15s ease;
  }
  .btn:hover { transform:translateY(-1px); }
  .btn.primary { background:#fff; color:#023c96; }
  .btn.ghost { color:#fff; border:1px solid rgba(255,255,255,.4); background:rgba(255,255,255,.06); backdrop-filter:blur(6px); }
  .btn.ghost:hover { background:rgba(255,255,255,.14); }
  footer { margin-top:auto; padding-bottom:22px; font-size:15px; font-weight:600; color:rgba(255,255,255,.75); text-shadow:0 1px 6px rgba(0,0,0,.5); }
  @media (max-width:600px) {
    main, footer { padding-left:16px; padding-right:16px; }
    .hero { background-position:78% bottom; }
  }
</style>
</head>
<body>
  <div class="hero">
    <main>
      <h1>Ceraunic</h1>
      <p class="lede">Weather cover for small businesses.</p>
      <p class="status">Research preview. Coming soon.</p>
      <div class="actions">
        <a class="btn primary" href="https://drive.google.com/file/d/11JSzSQfcXzbGG3awGQIk_TGgltG6ePZU/view?usp=sharing" target="_blank" rel="noopener">Read the working paper</a>
        <a class="btn ghost" href="mailto:hello@ceraunic.com">Get in touch</a>
      </div>
    </main>
    <footer>© 2026 Ceraunic</footer>
  </div>
</body>
</html>
