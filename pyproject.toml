[project]
name = "wi"
version = "0.0.1"
description = "weather-insurance: data layer, evaluation and reference engine"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "netCDF4",
    "requests",
    "xarray",
    "matplotlib",
    "statsmodels",
    "duckdb",
    "pydantic",
    "typer",
    "fastapi>=0.142.2",
    "upstash-redis>=1.8.0",
    "web3>=8.0.0",
    "eth-account>=0.14.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wi"]
